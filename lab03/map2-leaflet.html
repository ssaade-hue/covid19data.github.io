<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COVID-19 Cases — Proportional Symbols (Leaflet)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    html,body,#map { height: 100%; margin: 0; padding: 0; font-family: 'Open Sans', sans-serif }
    .title { position:absolute; left:12px; top:12px; z-index:400; background: rgba(255,255,255,0.9); padding:8px 12px; border-radius:4px; font-weight:600 }
    .legend { position:absolute; right:12px; bottom:12px; z-index:400; background:white; padding:8px 10px; border-radius:4px; box-shadow:0 0 6px rgba(0,0,0,0.2) }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="title">COVID-19 cases — 2020 (proportional symbols)</div>
  <div id="legend" class="legend"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([39, -98], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

    function radiusForCases(c) {
      if (!c) return 2;
      return Math.max(2, Math.sqrt(c) * 0.18);
    }

    fetch('assets/us-covid-2020-counts-centroids.json')
      .then(r => r.json())
      .then(geojson => {
        L.geoJSON(geojson, {
          pointToLayer: function(feature, latlng) {
            const c = feature.properties && feature.properties.cases;
            return L.circleMarker(latlng, {
              radius: radiusForCases(c),
              fillColor: 'rgba(215,48,39,0.85)',
              color: '#fff',
              weight: 0.6,
              fillOpacity: 0.8
            });
          },
          onEachFeature: function(feature, layer) {
            const p = feature.properties || {};
            layer.bindPopup(`<strong>${p.county}, ${p.state}</strong><br/>Cases: ${p.cases}<br/>Rate: ${p.rates} per 1,000`);
          }
        }).addTo(map);

        const legendDiv = document.getElementById('legend');
        const examples = [100, 1000, 10000];
        let html = '<strong>Cases (example sizes)</strong><br/>';
        examples.forEach(v => {
          const r = radiusForCases(v);
          html += `<div style="margin:6px 0;"><svg width="${r*2+6}" height="${r*2+6}"><circle cx="${r+3}" cy="${r+3}" r="${r}" fill="rgba(215,48,39,0.85)" stroke="#fff" stroke-width="0.6"/></svg>&nbsp; ${v}</div>`;
        });
        legendDiv.innerHTML = html;
      })
      .catch(err => console.error('Failed to load centroids geojson:', err));
  </script>
</body>
</html>
