<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COVID-19 Rates — Choropleth (Leaflet)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    html,body,#map { height: 100%; margin: 0; padding: 0; font-family: 'Open Sans', sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; right: 0; left: 0; }
    .legend { background: white; padding: 8px 10px; line-height: 1.3; border-radius: 4px; box-shadow: 0 0 6px rgba(0,0,0,0.2); }
    .legend .swatch { display:inline-block; width:18px; height:12px; margin-right:8px; vertical-align:middle }
    .title { position:absolute; left:12px; top:12px; z-index:400; background: rgba(255,255,255,0.85); padding:8px 12px; border-radius:4px; font-weight:600 }
    .nav-btn { position:absolute; right:12px; top:12px; z-index:400; background: #205072; color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; }
    .nav-btn:hover { background: #114b5f; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="title">COVID-19 rates (cases per 1,000) — 2020</div>
  <a href="map2.html" class="nav-btn">View Cases Map →</a>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([39, -98], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

    function getColor(d) {
      return d > 100 ? '#3f007d' :
             d > 80  ? '#6a51a3' :
             d > 60  ? '#9e9ac8' :
             d > 40  ? '#cbc9e2' :
             '#f2f0f7';
    }

    function style(feature) {
      const r = feature.properties && feature.properties.rates;
      return {
        fillColor: getColor(r),
        weight: 0.5,
        opacity: 1,
        color: '#ffffff',
        fillOpacity: 0.8
      };
    }

    function onEachFeature(feature, layer) {
      if (feature.properties) {
        const p = feature.properties;
        const html = `<strong>${p.county}, ${p.state}</strong><br/>Cases: ${p.cases}<br/>Rate: ${p.rates} per 1,000`;
        layer.bindPopup(html);
      }
    }

    fetch('assets/us-covid-2020-rates.json')
      .then(r => r.json())
      .then(geojson => L.geoJSON(geojson, { style: style, onEachFeature: onEachFeature }).addTo(map))
      .catch(err => console.error('Failed to load geojson:', err));

    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      const grades = [0, 40, 60, 80, 100];
      let labels = ['<strong>Rates<br/>(cases per 1,000)</strong>'];
      for (let i = 0; i < grades.length; i++) {
        const from = grades[i];
        const to = grades[i+1];
        labels.push('<div><i class="swatch" style="background:' + getColor(from + 1) + '"></i> ' + from + (to ? '&ndash;' + to : '+') + '</div>');
      }
      div.innerHTML = labels.join('');
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
